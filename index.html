<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026/27 ősz — Féléves ütemterv</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<style id="css">
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fff;--ink:#0a0a0a;--muted:#686868;--body:#454545;--soft:#f5f5f5;--line:#d9d9d9;--max:1440px;--gutter:clamp(20px,3vw,48px)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.shell{width:min(calc(100% - (var(--gutter)*2)),var(--max));margin:0 auto}
.meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

header.top{position:fixed;inset:0 0 auto 0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.nav{height:56px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:32px}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand small{margin-left:10px;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.12em}
.nav-links{display:flex;gap:22px;font-size:11px;justify-content:center}
.nav-links a{position:relative;padding:4px 0;color:var(--muted)}
.nav-links a::after{content:"";position:absolute;left:0;right:100%;bottom:-14px;height:1px;background:var(--ink);transition:right .16s ease}
.nav-links a b{color:var(--ink);font-weight:500;margin-right:5px}
.nav-links a:hover{color:var(--ink)}
.save{display:flex;align-items:center;gap:14px}
.save-state{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.save-state.dirty{color:var(--ink)}
.btn{border:1px solid var(--ink);background:transparent;padding:6px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn:hover:not(:disabled){background:var(--ink);color:#fff}
.btn:disabled{border-color:var(--line);color:var(--muted);cursor:default}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}

main{padding-top:95px}
.hero{padding:clamp(72px,9vw,128px) 0 48px}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);column-gap:20px}
.hero .meta.kick{grid-column:1/6}
.hero h1{grid-column:1/12;margin:28px 0 0;font-size:clamp(46px,7.4vw,118px);line-height:.9;letter-spacing:-.058em;font-weight:500}
.hero h1 span{display:block;font-weight:300}
.hero-copy{grid-column:7/11;margin:40px 0 0;font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:var(--body);max-width:600px}
.hero-meta{grid-column:1/6;margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;font-size:11px;color:var(--muted)}
.hero-meta strong{display:block;color:var(--ink);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}

/* timeline */
.tl{border-top:1px solid var(--ink);padding-top:14px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.tl-scale{position:relative;display:grid;grid-template-columns:repeat(14,1fr) .6fr 1fr;border-bottom:1px solid var(--line)}
.tl-cell{border-left:1px solid var(--line);padding:0 6px 12px;min-height:118px;display:flex;flex-direction:column}
.tl-cell.gap{border-left:0}
.tl-cell .w{font-size:11px;font-weight:500}
.tl-cell .d{font-size:9px;color:var(--muted);letter-spacing:.04em}
.tl-cell .mk{margin-top:auto;font-size:10px;line-height:1.25}
.tl-cell.contact .bar{height:3px;background:var(--line);margin:10px 0 8px}
.tl-cell.key .bar{height:3px;background:var(--ink);margin:10px 0 8px}
.tl-cell.brk .d::after{content:" · szünet"}
.tl-cell .mk b{display:block;font-size:17px;letter-spacing:-.02em;font-weight:500}
.tl-today{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1px solid var(--ink)}
.tl-today span{position:absolute;bottom:-2px;left:5px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.next{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:44px;border-top:1px solid var(--ink);padding-top:18px}
.next-title{font-size:clamp(26px,3.6vw,54px);line-height:1.02;letter-spacing:-.045em;font-weight:400}
.next-side{text-align:right}
.next-side b{display:block;font-size:clamp(26px,3.6vw,54px);font-weight:300;letter-spacing:-.04em;line-height:1}

section{padding:clamp(72px,9vw,128px) 0}
section+section{border-top:1px solid var(--line)}
.sec{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.sec-index{grid-column:1/3;align-self:start;position:sticky;top:123px;font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.sec-index b{color:var(--ink);font-weight:500}
.sec-main{grid-column:3/13;min-width:0}
.sec-title{margin:0 0 18px;font-size:clamp(30px,3.8vw,58px);line-height:1.03;letter-spacing:-.045em;font-weight:400;max-width:980px}
.sec-lead{margin:0 0 56px;max-width:640px;color:var(--body)}
.list{border-top:1px solid var(--ink)}
.row{border-bottom:1px solid var(--line);padding:22px 0 24px}
.lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 3px}
.lbl:first-child{margin-top:0}
.tag{display:inline-block;font-size:10px;letter-spacing:.04em;border:1px solid var(--line);padding:3px 6px;color:#575757;margin:0 5px 5px 0}
.tag.ink{border-color:var(--ink);color:var(--ink)}

/* schedule */
.s-row{display:grid;grid-template-columns:64px 104px minmax(0,1.25fr) minmax(0,1fr) 188px;gap:24px}
.s-row>*{min-width:0}
.s-row h3,.s-row p,.d-item,.r-row,.q-row,.t td{overflow-wrap:anywhere}
.s-row .wk{font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1}
.s-row .dt{font-size:12px}
.s-row .dt small{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.s-row h3{margin:4px 0 0;font-size:17px;line-height:1.3;letter-spacing:-.015em;font-weight:500}
.s-row .dl{margin-top:10px;font-size:13px;font-weight:700}
.s-row p{margin:0;color:var(--body)}
.s-row .small{font-size:12.5px}
.s-row.key{border-top:1px solid var(--ink);margin-top:-1px}
.s-row.sugg h3,.s-row.brk h3{font-weight:400;color:var(--body)}
.s-row.sugg .wk,.s-row.brk .wk,.s-row.self .wk{color:var(--muted);font-weight:400}
.s-row.past{opacity:.5}
.ctl select,.ctl input,.ctl textarea{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:5px 0;font-size:12px;border-radius:0;appearance:none;-webkit-appearance:none}
.ctl select{padding-right:20px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.ctl input,.ctl textarea{border-bottom-color:var(--line)}
.ctl input:focus,.ctl textarea:focus{border-bottom-color:var(--ink);outline:0}
.ctl textarea{resize:vertical;min-height:30px;line-height:1.45;overflow:hidden}
.ctl + .ctl{margin-top:10px}
.st-kesz select,.st-leadva select{font-weight:700}

/* deliverables */
.d-group{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:24px;border-top:1px solid var(--ink);padding:22px 0 60px}
.d-code{font-size:clamp(40px,5vw,72px);line-height:.9;letter-spacing:-.05em;font-weight:500}
.d-name{font-size:15px;margin-top:10px}
.d-dl{font-size:13px;font-weight:700;margin-top:4px}
.prog{margin-top:28px}
.prog-n{font-size:28px;font-weight:300;letter-spacing:-.03em}
.prog-bar{height:1px;background:var(--line);margin-top:8px;position:relative}
.prog-bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.d-item{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.d-item>*{min-width:0}

.d-item .n{font-size:14px}
.d-item .f{font-size:12px;color:var(--muted)}
.d-item.done .n{font-weight:500}

/* generic tables */
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:400;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 16px 10px 0;border-bottom:1px solid var(--ink);vertical-align:bottom}
.t td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body)}
.t td.strong{color:var(--ink);font-weight:500}
.t td.r,.t th.r{text-align:right}
.t tr.total td{border-top:1px solid var(--ink);border-bottom:0;color:var(--ink);font-weight:500}
.t .ctl input{text-align:right;max-width:90px;margin-left:auto;display:block}
.wrap{overflow-x:auto}
.result{display:grid;grid-template-columns:1fr auto;align-items:end;border-top:1px solid var(--ink);margin-top:48px;padding-top:18px}
.result b{font-size:clamp(34px,4.5vw,66px);font-weight:400;letter-spacing:-.045em;line-height:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);margin-top:40px;border-top:1px solid var(--line)}
.scale div{padding:12px 12px 0 0;font-size:12px;color:var(--muted)}
.scale div b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.scale div.on{color:var(--ink)}
.scale div.on{border-top:3px solid var(--ink);margin-top:-2px}
.notes{margin-top:48px;columns:2;column-gap:40px;font-size:13px;color:var(--body)}
.notes p{margin:0 0 12px;break-inside:avoid}

.r-row{display:grid;grid-template-columns:170px minmax(0,1fr) 110px 120px;gap:24px;padding:16px 0;border-bottom:1px solid var(--line)}
.r-row>*{min-width:0}
.r-row .a{font-weight:500;font-size:13px}
.r-row p{margin:0;color:var(--body)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-top:56px}
.facts div{padding:16px 16px 18px 0;border-bottom:1px solid var(--line)}
.facts b{display:block;font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1.1}
.facts span{font-size:11px;color:var(--muted)}
.q-row{display:grid;grid-template-columns:40px 170px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}
.q-row>*{min-width:0}
.q-row p{margin:0;color:var(--body);font-size:13px}
.q-row .n{color:var(--muted);font-size:11px}

footer{border-top:1px solid var(--line);padding:18px 0 32px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.foot{display:grid;grid-template-columns:1fr auto;gap:20px}
.ro .ctl select,.ro .ctl input,.ro .ctl textarea{pointer-events:none;border-bottom-color:transparent}

@media(max-width:1100px){
  .nav-links{display:none}.nav{grid-template-columns:1fr auto}
  .sec-index{grid-column:1/13;position:static}.sec-main{grid-column:1/13}
  .tl-scale{grid-template-columns:repeat(8,1fr)}.tl-cell{min-height:92px;border-top:1px solid var(--line)}.tl-cell.gap{display:none}.tl-today{display:none}
  .d-group{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}.notes{columns:1}
  .hero h1{grid-column:1/13}.hero-copy{grid-column:3/13}.hero-meta{grid-column:1/13}
}
@media(max-width:880px){
  .s-row{grid-template-columns:48px minmax(0,1fr);row-gap:10px}.s-row>*:nth-child(n+3){grid-column:2}
  .r-row{grid-template-columns:minmax(0,1fr) 170px;row-gap:12px}.r-row .a,.r-row p{grid-column:1/-1}
  .q-row{grid-template-columns:32px minmax(0,1fr);row-gap:12px}.q-row>*:nth-child(n+3){grid-column:2}
}
@media(max-width:820px){
  .d-item{grid-template-columns:1fr 1fr}.d-item>div:first-child{grid-column:1/-1}
}
@media(max-width:620px){
  .hero-copy{grid-column:1/13}.brand small{display:none}.save-state{display:none}
  .tl-scale{grid-template-columns:repeat(4,1fr)}.d-item{grid-template-columns:1fr}.d-item>div:first-child{grid-column:auto}
  .r-row{grid-template-columns:1fr}.r-row>*{grid-column:1!important}
  .next{grid-template-columns:1fr}.next-side{text-align:left}.scale{grid-template-columns:1fr 1fr 1fr}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{
  @page{size:A3 landscape;margin:14mm}
  header.top{display:none}main{padding-top:0}section{padding:40px 0;break-inside:auto}
  .sec-index{position:static}.row,.d-item,.r-row,.q-row{break-inside:avoid}.s-row.past{opacity:1}
  .ctl select{background-image:none}
}

/* multi-page additions */
.nav-links a.on{color:var(--ink)}
.nav-links a.on::after{right:0}
.crumb{grid-column:1/13;margin:0 0 18px;display:flex;align-items:baseline;gap:10px}
.crumb a{font-size:11px;color:var(--muted)}
.crumb a:hover{color:var(--ink)}
.crumb span{font-size:11px;color:var(--line)}
.crumb b{font-size:11px;color:var(--ink);font-weight:500}
.pager{grid-column:1/13;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);margin-top:64px}
.pager a{padding:22px 0;display:block}
.pager a.next{text-align:right}
.pager .pg-meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pager .pg-title{font-size:20px;letter-spacing:-.02em;font-weight:500}
.pager a:hover .pg-title{text-decoration:underline}
.pager a.prev{border-right:1px solid var(--line);padding-right:24px}
.pager a.next{padding-left:24px}
@media(max-width:620px){.pager{grid-template-columns:1fr}.pager a.prev{border-right:0;border-bottom:1px solid var(--line);padding-right:0}}

/* index / landing */
.idx-grid{grid-column:1/-1;border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.idx-item{border-bottom:1px solid var(--line);padding:26px 24px 26px 0;display:grid;grid-template-columns:56px 1fr;gap:20px}
.idx-item:nth-child(odd){border-right:1px solid var(--line);padding-right:24px}
.idx-item:nth-child(even){padding-left:24px}
.idx-item .n{font-size:13px;color:var(--muted)}
.idx-item h3{margin:0 0 6px;font-size:20px;font-weight:500;letter-spacing:-.02em}
.idx-item p{margin:0;color:var(--body);font-size:13px}
.idx-item:hover h3{text-decoration:underline}
@media(max-width:700px){.idx-grid{grid-template-columns:1fr}.idx-item:nth-child(odd){border-right:0;padding-right:0}.idx-item:nth-child(even){padding-left:0}}

@media(max-width:700px){
  .subject-nav a{padding:0 12px}
  .subject-nav a:first-child{padding-left:0;padding-right:14px}
  .subject-nav a.on::after{left:12px;right:12px}
  .subject-nav a:first-child.on::after{left:0}
  .subject-nav .name{display:none}
}

/* single-file router additions */
.tl-cell .mk a{color:inherit;text-decoration:none;display:block}
a.next-link{display:block}
.next-link:hover .next-title{text-decoration:underline}


/* semester dashboard */
.subject-bar{height:39px;border-top:1px solid var(--line);background:#fff}
.subject-nav{height:38px;display:flex;align-items:stretch;gap:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
.subject-nav::-webkit-scrollbar{display:none}
.subject-nav a{position:relative;display:flex;align-items:center;gap:7px;padding:0 16px;border-right:1px solid var(--line);font-size:10px;letter-spacing:.04em;color:var(--muted);flex:0 0 auto}
.subject-nav a:first-child{padding-left:0;padding-right:18px}
.subject-nav a:hover,.subject-nav a.on{color:var(--ink)}
.subject-nav a.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--ink)}
.subject-nav a:first-child.on::after{left:0}
.subject-nav .code{font-weight:600;color:var(--ink);letter-spacing:.02em}
.subject-nav .name{font-weight:400}
.sem-hero{padding:clamp(68px,8vw,112px) 0 46px}
.sem-hero h1{grid-column:1/12;margin:28px 0 0;font-size:clamp(48px,7vw,108px);line-height:.91;letter-spacing:-.058em;font-weight:500}
.sem-hero h1 span{display:block;font-weight:300}
.sem-intro{grid-column:7/11;margin:38px 0 0;max-width:600px;font-size:clamp(15px,1.15vw,18px);line-height:1.55;color:var(--body)}
.sem-facts{grid-column:1/6;margin-top:38px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;font-size:11px;color:var(--muted)}
.sem-facts strong{display:block;color:var(--ink);font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ink)}
.course-card{display:grid;grid-template-columns:62px minmax(0,1fr);gap:20px;padding:26px 24px 28px 0;border-bottom:1px solid var(--line);min-width:0}
.course-card:nth-child(odd){border-right:1px solid var(--line);padding-right:24px}
.course-card:nth-child(even){padding-left:24px}
.course-card .code{font-size:12px;color:var(--muted);letter-spacing:.04em}
.course-card h3{margin:0 0 6px;font-size:21px;line-height:1.15;font-weight:500;letter-spacing:-.025em}
.course-card p{margin:0;color:var(--body);font-size:13px;max-width:620px}
.course-card .course-meta{margin-top:14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.course-card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.sem-wrap{overflow-x:auto;padding-bottom:6px}
.sem-timeline{min-width:1140px;border-top:1px solid var(--ink);display:grid;grid-template-columns:190px repeat(14,minmax(62px,1fr))}
.sem-corner,.sem-week,.sem-course,.sem-cell{min-height:66px;border-bottom:1px solid var(--line)}
.sem-corner{padding:12px 12px 12px 0}
.sem-week{padding:10px 7px;border-left:1px solid var(--line);font-size:10px;color:var(--muted)}
.sem-week b{display:block;font-size:12px;color:var(--ink);font-weight:500}
.sem-week.current{border-top:3px solid var(--ink);padding-top:7px}
.sem-course{position:sticky;left:0;z-index:2;background:#fff;padding:13px 18px 12px 0}
.sem-course b{display:block;font-size:12px;font-weight:500;line-height:1.15}
.sem-course span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
.sem-cell{border-left:1px solid var(--line);padding:8px 6px;position:relative;font-size:9px;line-height:1.22;color:var(--body)}
.sem-cell.current{background:linear-gradient(to bottom,var(--soft),transparent 55%)}
.sem-mark{display:block;margin-bottom:5px;white-space:normal}
.sem-mark::before{content:"";display:block;height:2px;background:var(--line);margin-bottom:5px}
.sem-mark.key{color:var(--ink);font-weight:500}
.sem-mark.key::before{height:3px;background:var(--ink)}
.sem-mark.deadline{color:var(--ink);font-weight:500}
.sem-mark.deadline::before{height:1px;background:var(--ink)}
.sem-empty{color:var(--muted);font-size:10px;padding-top:17px}

.deadline-list{border-top:1px solid var(--ink)}
.deadline-row{display:grid;grid-template-columns:110px 160px minmax(0,1fr) 170px;gap:24px;padding:17px 0;border-bottom:1px solid var(--line);align-items:start}
.deadline-row>*{min-width:0}
.deadline-date{font-size:16px;letter-spacing:-.02em;font-weight:500}
.deadline-date small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.06em;margin-top:2px}
.deadline-course{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.deadline-title{font-size:14px;line-height:1.3}
.deadline-row.past{opacity:.45}
.deadline-row.near .deadline-date{font-weight:700}

.course-hero{padding:clamp(68px,8vw,108px) 0 44px}
.course-hero .meta.kick{grid-column:1/7}
.course-hero h1{grid-column:1/12;margin:26px 0 0;font-size:clamp(42px,6.6vw,98px);line-height:.92;letter-spacing:-.055em;font-weight:500}
.course-hero h1 span{display:block;font-weight:300}
.course-hero .hero-meta{grid-column:1/8}
.course-hero .hero-copy{grid-column:8/13;margin-top:40px}
.course-jump{margin-top:58px;border-top:1px solid var(--ink);display:flex;gap:20px;flex-wrap:wrap;padding-top:12px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.course-jump a:hover{color:var(--ink)}
.course-section{padding:72px 0}
.course-section+.course-section{border-top:1px solid var(--line)}
.course-section .sec-main{grid-column:3/13}
.course-section .sec-index{top:84px}
.simple-row{display:grid;grid-template-columns:96px 150px minmax(0,1fr) 180px;gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}
.simple-row>*{min-width:0}
.simple-row .week{font-size:18px;font-weight:500;line-height:1}
.simple-row .date{font-size:12px;color:var(--body)}
.simple-row h3{margin:0;font-size:15px;line-height:1.3;font-weight:500}
.simple-row p{margin:5px 0 0;font-size:12.5px;color:var(--body)}
.simple-row.key{border-top:1px solid var(--ink);margin-top:-1px}
.simple-row.past{opacity:.5}
.check-row{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:24px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.check-row .n{font-size:13px}
.check-row .f{font-size:11px;color:var(--muted);margin-top:3px}
.notice{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:18px 0;color:var(--body);max-width:760px}
.notice b{color:var(--ink);font-weight:500}
.mini-facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-top:42px}
.mini-facts div{padding:14px 18px 16px 0;border-bottom:1px solid var(--line)}
.mini-facts b{display:block;font-size:22px;font-weight:300;letter-spacing:-.03em}
.mini-facts span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.weight-row{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}
.weight-row b{font-weight:500}.weight-row span{text-align:right;font-variant-numeric:tabular-nums}
.source-note{font-size:10px;color:var(--muted);margin-top:24px;letter-spacing:.04em}

@media(max-width:1100px){
  .sem-intro{grid-column:3/13}.sem-facts{grid-column:1/13}
  .course-hero .hero-copy{grid-column:3/13}.course-hero .hero-meta{grid-column:1/13}
  .simple-row{grid-template-columns:70px 120px minmax(0,1fr)}.simple-row>div:last-child{grid-column:3}
}
@media(max-width:760px){
  .course-grid{grid-template-columns:1fr}.course-card:nth-child(odd){border-right:0;padding-right:0}.course-card:nth-child(even){padding-left:0}
  .deadline-row{grid-template-columns:92px minmax(0,1fr);gap:10px 18px}.deadline-course{grid-column:2}.deadline-title{grid-column:2}.deadline-row>div:last-child{grid-column:2}
  .sem-intro{grid-column:1/13}.sem-facts{grid-template-columns:1fr 1fr}
  .simple-row{grid-template-columns:54px minmax(0,1fr);gap:10px 16px}.simple-row .date{grid-column:2}.simple-row>div:nth-child(3),.simple-row>div:last-child{grid-column:2}
  .mini-facts{grid-template-columns:1fr 1fr}.check-row{grid-template-columns:1fr}
}
@media(max-width:520px){
  .sem-facts{grid-template-columns:1fr}.course-card{grid-template-columns:48px 1fr}.mini-facts{grid-template-columns:1fr}
}

00 m² részletes helyiséglistával, elkülönített gazdasági bejárat) + szabadon definiált közösségi funkciók (600 m²) + tárolók (5 m²/lakás, ráccsal elválasztva, lakásmérethez igazítva).", "src": "M1; M2"}, {"id": "r14", "area": "Lakások", "text": "Okos térkihasználás; lehetőség szerint minden lakáshoz használható erkély/terasz (80 m²-ig 5–20 m²; nagyobb/felsőbb lakásnál több); megfelelő természetes fény minden lakásban; vegyes lakói csoportok (családok, idősek, egyedülállók).", "src": "M1"}, {"id": "r15", "area": "Gépészet", "text": "Fűtés, hűtés, gépi szellőzés (lakószobákban is); távhő; gépészetet nem kell tervezni, de helyigényét (aknák, gépészeti helyiségek) igen; karbantartandó elemek hozzáférhetősége; épületfelügyeleti helyiség szellőzése, temperálása.", "src": "M1; M2"}, {"id": "r16", "area": "Hulladék", "text": "8 lakásonként 2 kommunális + 1 papír + 1 műanyag 240 l-es kuka; közlekedési útról kis kitérővel, kuka kihúzása belső tér érintése nélkül; bejáratnál szintkülönbség nem megengedett; falikút, padlóösszefolyó, vödör emelés nélküli töltése; közösségi komposztáló terület.", "src": "M1"}, {"id": "r17", "area": "Mobilitás", "text": "Carsharing feltételezése (20 carsharing + 20 vendégparkoló, 1200 m²; felszíni vagy mélygarázs, elhelyezés opcionális); kerékpár min. 2/lakás, fedett, könnyen megközelíthető (300 m²); közeli elhagyott vasúti pálya reaktiválása feltételezhető.", "src": "M1; M2; S3"}, {"id": "r18", "area": "Kiszolgálás", "text": "Üzemeltetési raktár teherhordó polcokkal (takarítószertártól független); épületfelügyeleti helyiség IT-eszközöknek és dokumentációnak.", "src": "M1"}, {"id": "r19", "area": "Akadálymentesség", "text": "Akadálymentes épített környezet követelményei (segédlet).", "src": "S5"}, {"id": "r20", "area": "Grafika", "text": "Magas műszaki és grafikai minőség elvárás; a verbális megfogalmazás nem elég.", "src": "Tematika; S1"}, {"id": "r21", "area": "Fájlnevek", "text": "ET_[név].pdf · KK_[név].pdf · Z_[név].pdf — mind online, 23:59-e function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function g(id,f,def){var o=S.v[id];return o&&o[f]!=null?o[f]:def}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function days(s){return Math.round((pd(s)-today())/864e5)}
function hdate(s){var a=s.split("-");return a[0]+"."+a[1]+"."+a[2]+"."}
function dayTxt(n){return n<0?"elmúlt":n===0?"ma":n+" nap"}
function deadlineISO(r){var m=(r.deadline||"").match(/(\d{4})\.(\d{2})\.(\d{2})/);return m?m[1]+"-"+m[2]+"-"+m[3]:null}
function sel(id,f,opts,def){var v=g(id,f,def);return '<div class="ctl"><select data-k="'+id+'" data-f="'+f+'" aria-label="'+f+'">'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join("")+'</select></div>'}
function inp(id,f,ph,type){return '<div class="ctl"><input '+(type?'type="'+type+'" inputmode="decimal" ':'')+'data-k="'+id+'" data-f="'+f+'" placeholder="'+esc(ph||"")+'" value="'+esc(g(id,f,""))+'"></div>'}
function ta(id,f,ph){return '<div class="ctl"><textarea rows="1" data-k="'+id+'" data-f="'+f+'" placeholder="'+esc(ph||"")+'">'+esc(g(id,f,""))+'</textarea></div>'}
function srcTags(s){return (s||"").split(/,\s*/).filter(function(x){return x&&x!=="—"}).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join("")}
function auto(t){t.style.height="auto";t.style.height=Math.max(30,t.scrollHeight)+"px"}
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function lsSet(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function lsDel(){try{localStorage.removeItem(KEY)}catch(e){}}
(function restore(){var d=lsGet();if(d&&d.base===S.savedAt&&d.v){S.v=d.v;dirty=!!d.dirty;if(!dirty)localOnly=true}else if(d){lsDel()}})();

function renderTimeline(){
  var weeks=DATA.sched.filter(function(r){return /^\d+$/.test(r.wk)});
  var pot=DATA.sched.filter(function(r){return r.wk==="Pótlás"})[0];
  var abbr={4:["ET","Esettanulmány"],9:["KK","Kritikus konz."],14:["Z","Záró"]};
  var h='<div class="tl"><div class="tl-head"><span class="meta">Félév / 14 hét + pótlás</span><span class="meta">Csütörtökök</span></div><div class="tl-scale" id="tlscale">';
  weeks.forEach(function(r){
    var c=r.kind==="key"?"key":r.kind==="hiv"&&r.typ.indexOf("Kontakt")===0?"contact":r.kind==="break"?"brk":"";
    var a=abbr[+r.wk];
    h+='<div class="tl-cell '+c+'"><span class="w num">'+esc(r.wk)+'</span><span class="d num">'+hdate(r.date).slice(5)+'</span>'+(c==="key"||c==="contact"?'<div class="bar"></div>':'<div style="height:21px"></div>')+'<div class="mk">'+(a?'<a href="#sched"><b>'+a[0]+'</b>'+a[1]+'</a>':(c==="contact"?"Konzultáció":""))+'</div></div>';
  });
  h+='<div class="tl-cell gap"></div><div class="tl-cell key"><span class="w">Pót.</span><span class="d num">'+hdate(pot.date).slice(5)+'</span><div class="bar"></div><div class="mk"><a href="#sched"><b>Z</b>Pótlás</a></div></div>';
  h+='<div class="tl-today" id="tltoday"><span>Ma</span></div></div></div>';
  var nx=DATA.sched.filter(function(r){var dl=deadlineISO(r);return dl&&days(dl)>=0})[0];
  if(nx){var dl=deadlineISO(nx);
    var name=nx.event.split(":")[0];name=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();
    var wkLabel=nx.wk==="Pótlás"?"Pótlás":nx.wk+". hét";
    h+='<a class="next-link" href="#sched"><div class="next"><div><div class="meta" style="margin-bottom:10px">Következő leadás</div><div class="next-title">'+esc(name)+'<br>'+esc(nx.deadline.replace(/,?\s*online/,""))+'</div></div><div class="next-side"><b class="num">'+dayTxt(days(dl))+'</b><span class="meta">'+esc(wkLabel)+'</span></div></div></a>';}
  return h;
}
function placeToday(){
  var sc=document.getElementById("tlscale"),m=document.getElementById("tltoday");if(!sc||!m)return;
  var weeks=DATA.sched.filter(function(r){return /^\d+$/.test(r.wk)});
  var cells=sc.querySelectorAll(".tl-cell"),t=today(),first=pd(weeks[0].date);
  var idx=Math.floor((t-first)/(7*864e5));
  if(idx<0||idx>13){m.style.display="none";return}
  var into=((t-first)/(7*864e5))-idx;var c=cells[idx];
  m.style.left=(c.offsetLeft+c.offsetWidth*into)+"px";
}

    var st=g(r.id,"status",(r.kind==="hiv"&&r.wk!=="1")||r.kind==="key"?"Nincs elkezdve":"—");
    var hasDl=r.deadline&&r.deadline!=="—", hasC=r.content&&r.content!=="—", hasN=r.naplo&&r.naplo!=="—", hasE=r.evalu&&r.evalu!=="—";

      '<div class="dt num">'+hdate(r.date)+'<small>'+dayTxt(n)+'</small></div>'+

function route(keepScroll){

    else{var p=pageOf(parts[1]);if(!p){location.hash='k3';return}document.title=p.num+' '+p.label+' — Komplex 3';app.innerHTML=chromeHead('k3')+k3SectionBody(p)+chromeFoot();document.getElementById('content').innerHTML=p.wrap?'<div class="list">'+p.fn()+'</div>':p.fn();document.querySelectorAll('textarea').forEach(auto);}
  }else if(parts[0]==='tm1'){document.title='Tervezésmódszertan 1 — 2026/27';app.innerHTML=chromeHead('tm1')+tmBody()+chromeFoot();document.querySelectorAll('textarea').forEach(auto);}
  else if(parts[0]==='mv'){document.title='Műemlékvédelem — 2026/27';app.innerHTML=chromeHead('mv')+mvBody()+chromeFoot();document.querySelectorAll('textarea').forEach(auto);}

  else if(pageOf(parts[0])){location.hash='k3/'+parts[0];return}

/* ---- save ---- */
function updateSave(){
  var s=document.getElementById("savestate"),b=document.getElementById("savebtn"),f=document.getElementById("savedat");if(!s)return;
  if(readOnly){s.textContent="Csak olvasható";b.disabled=true}
  else if(saving){s.textContent="Mentés…";b.disabled=true}
  else if(dirty){s.textContent="Nem mentett változások";s.className="save-state dirty";b.disabled=false}
  else{s.textContent=localOnly?"Mentve ebben a böngészőben":(S.savedAt?"Mentve":"Nincs változás");s.className="save-state";b.disabled=true}
  if(f)f.textContent=S.savedAt?"Utoljára mentve: "+new Date(S.savedAt).toLocaleString("hu-HU"):"";
}
function msg(t){var s=document.getElementById("savestate");if(s){s.textContent=t;s.className="save-state dirty"}}
function setVal(el){
  var k=el.getAttribute("data-k"),f=el.getAttribute("data-f");
  S.v[k]=S.v[k]||{};S.v[k][f]=el.value;dirty=true;localOnly=false;
  lsSet({base:S.savedAt,v:S.v,dirty:true});
}
document.addEventListener("input",function(e){var el=e.target;if(!el.hasAttribute||!el.hasAttribute("data-k"))return;setVal(el);if(el.tagName==="TEXTAREA")auto(el);updateSave()});
document.addEventListener("change",function(e){var el=e.target;if(!el.hasAttribute||!el.hasAttribute("data-k"))return;setVal(el);if(el.tagName==="SELECT"||el.getAttribute("data-f")==="pts"||el.getAttribute("data-f")==="plan"){route(true)}});
document.addEventListener("click",function(e){if(e.target&&e.target.id==="savebtn")save()});
window.addEventListener("beforeunload",function(e){if(dirty&&!saving&&!localOnly){e.preventDefault();e.returnValue=""}});

function buildDoc(next){
  var css=document.getElementById("css").textContent;
  var main=document.getElementById("main").textContent;
  var d=JSON.stringify(next.savedAt);
  var v=JSON.stringify(next.v).replace(/<\//g,"<\\/");
  var body=main.replace(/^var S=.*;\n/m,'var S={savedAt:'+d+',v:'+v+'};\n').replace(/^var DATA=.*?;\n/m,'var DATA='+JSON.stringify(DATA).replace(/<\//g,"<\\/")+';\n');
  return "<!doctype html>\n<html lang=\"hu\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>2026/27 ősz — Féléves ütemterv</title>\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E\">\n<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script id=\"main\">"+body+"<\/script>\n</body>\n</html>\n";
}
function save(){
  if(!dirty||saving||readOnly)return;
  if(!art){localOnly=true;dirty=false;lsSet({base:S.savedAt,v:S.v,dirty:false});updateSave();return}
  saving=true;updateSave();
  var next={savedAt:new Date().toISOString(),v:S.v};
  art.publish(buildDoc(next)).then(function(){S.savedAt=next.savedAt;saving=false;dirty=false;localOnly=false;lsDel();updateSave();}).catch(function(err){
    saving=false;var c=err&&err.code;
    if(c==="conflict"){msg("Újabb verzió töltődik be")}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){readOnly=true;art=null;route();}
    else if(c==="rate_limited"){msg("Túl gyakori mentés, próbáld pár perc múlva");dirty=true;updateSave()}
    else if(c==="too_large"){msg("Túl nagy a tartalom a mentéshez");updateSave()}
    else{msg("A mentés nem sikerült, próbáld újra");dirty=true;updateSave()}
  });
}

route();
try{if(window.claude&&window.claude.use){window.claude.use("artifact").then(function(a){art=a||null;updateSave()}).catch(function(){})}}catch(e){}
